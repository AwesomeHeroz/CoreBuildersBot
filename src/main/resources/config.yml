discord:
  token: "" # Prefer DISCORD_BOT_TOKEN
  guild-id: "" # Required; prefer DISCORD_GUILD_ID
  permissions:
    trusted-staff-role-ids: []
    admin-role-ids: []
    leadership-role-ids: []
  text-commands:
    enabled: false
    prefix: "!core"
  channels:
    staff-approval: "staff-approvals"
    contribution-log: "contribution-log"
    economy-log: "economy-log"
    achievements: "achievements"
    leaderboard: "core-leaderboard"


music:
  enabled: true
  default-volume: 80
  max-queue-size: 100
  max-playlist-tracks: 25
  max-track-duration-minutes: 180
  allow-streams: true
  idle-disconnect-seconds: 300
  load-timeout-seconds: 20
progression:
  # Used only for the displayed level. Rank thresholds are configured independently below.
  xp-per-level: 500
  ranks:
    - code: "RECRUIT"
      name: "Recruit"
      minimum-xp: 0
      discord-role-id: ""
    - code: "MEMBER"
      name: "Member"
      minimum-xp: 500
      discord-role-id: ""
    - code: "CONTRIBUTOR"
      name: "Contributor"
      minimum-xp: 1500
      discord-role-id: ""
    - code: "VETERAN"
      name: "Veteran"
      minimum-xp: 4000
      discord-role-id: ""
    - code: "ELITE"
      name: "Elite"
      minimum-xp: 8000
      discord-role-id: ""
    - code: "NOBLE"
      name: "Noble"
      minimum-xp: 15000
      discord-role-id: ""
    - code: "CORE_LEGEND"
      name: "Core Legend"
      minimum-xp: 30000
      discord-role-id: ""

shop:
  # Existing database items omitted from this list are disabled, never deleted.
  disable-unlisted-items: true

  # Keep false so purchases survive restarts. Enable only when YAML is the stock source of truth.
  sync-stock-on-startup: false

  # stock: unlimited (or null/omitted) means the item has no stock limit.
  # Set items: [] to disable the whole configured catalog when disable-unlisted-items is true.
  items:
    - code: "BASIC_GEAR"
      name: "Basic Gear Shulker"
      description: "A basic gear package for group members."
      price: 250
      stock: unlimited
      active: true
    - code: "SURVIVAL_KIT"
      name: "Survival Kit"
      description: "A complete survival resupply kit."
      price: 400
      stock: unlimited
      active: true
    - code: "XP_SHULKER"
      name: "XP Bottle Shulker"
      description: "A shulker of XP bottles."
      price: 500
      stock: 25
      active: true
    - code: "BUILDING_PACKAGE"
      name: "Building Material Package"
      description: "A standard package of building materials."
      price: 750
      stock: unlimited
      active: true
    - code: "LARGE_MATERIAL_REQUEST"
      name: "Large Material Request"
      description: "A larger custom material allocation."
      price: 2000
      stock: unlimited
      active: true
    - code: "CUSTOM_MAPART"
      name: "Custom Mapart Request"
      description: "Request a custom group mapart project."
      price: 3000
      stock: unlimited
      active: true
    - code: "PROJECT_ASSISTANCE"
      name: "Group Project Assistance"
      description: "Request organized group assistance for a project."
      price: 5000
      stock: unlimited
      active: true

  # Empty means anyone in the same voice channel can control playback.
  controller-role-ids: []

  # YouTube, SoundCloud, Bandcamp, Vimeo and Twitch are always supported.
  # Generic HTTPS audio/radio URLs require both settings below.
  allow-direct-urls: false
  allowed-direct-url-hosts: []

integrations:
  hypergliding:
    base-url: "https://hypergliding.com/api/"
    api-key: "" # Prefer COREBOT_HYPERGLIDING_API_KEY
    timeout-seconds: 15
    user-cooldown-seconds: 10
    cache-seconds: 30
    global-requests-per-minute: 20

applications:
  enabled: false
  entry-panel:
    enabled: true
    channel: "apply"
    message-id: ""
    title: "Core Builders Applications"
    description: |
      Interested in joining Core Builders?
      Click **Apply Now** to begin your application.
    button:
      label: "Apply Now"

  channels:
    pending: "pending"
    accepted: "accepted"
    rejected: "denied"

  reviewer-role-ids: []
  approval:
    role-id: ""

  prevent-duplicate-pending: true
  allow-reapply-after-decision: true
  session-expiry-minutes: 30

  uploads:
    max-file-size-mb: 15
    max-total-size-mb: 50

  tickets:
    category: "application-tickets"
    name-pattern: "application-{username}-{id}"
    delete-on-decision: false

  messages:
    submitted: "Your application has been submitted successfully. The Core Builders team will review it."
    accepted: "Your Core Builders application has been accepted by {reviewer}. You received the {role} role. Welcome to the group!"
    rejected: "Your Core Builders application has been rejected by {reviewer}. Reason: {reason}"
    ticket-created: "A private discussion ticket was created for your application: {ticket}"
    ticket-opening: "Please use this channel to discuss the application."

  questions:
    - id: "minecraft_name"
      type: "text"
      label: "What is your Minecraft username?"
      placeholder: "Your Minecraft username"
      required: true
      style: "short"
      min-length: 2
      max-length: 100

    - id: "about_you"
      type: "text"
      label: "Tell us about yourself"
      required: true
      style: "paragraph"
      min-length: 20
      max-length: 2000

    - id: "why_join"
      type: "text"
      label: "Why do you want to join?"
      required: true
      style: "paragraph"
      min-length: 20
      max-length: 2000

    - id: "contribution"
      type: "text"
      label: "How can you contribute?"
      required: true
      style: "paragraph"
      min-length: 20
      max-length: 2000

    - id: "evidence"
      type: "upload"
      label: "Upload examples of your work"
      required: false
      min-files: 0
      max-files: 5

database:
  host: "localhost"
  port: 3306
  name: "corebuilders_bot"
  username: "root"
  password: "" # Prefer COREBOT_DB_PASSWORD
  ssl-mode: "DISABLED" # Allowed by default only for localhost/loopback
  allow-insecure-remote: false
  jdbc-url: "" # Prefer COREBOT_DB_URL
  maximum-pool-size: 10
  minimum-idle: 1
  connection-timeout-ms: 10000
  validation-timeout-ms: 5000
  migrations:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

minecraft:
  link-code-expiry-minutes: 10
  leaderboard-size: 10

website:
  # Starts an embedded HTTP server inside the Paper plugin.
  enabled: false
  bind-address: "0.0.0.0"
  port: 8080
  # Public origin only, with no path, query, or fragment. Use HTTPS in production.
  public-base-url: "http://localhost:8080"
  worker-threads: 16
  max-request-bytes: 1048576

  discord-oauth:
    client-id: "" # Prefer COREBOT_DISCORD_OAUTH_CLIENT_ID
    client-secret: "" # Prefer COREBOT_DISCORD_OAUTH_CLIENT_SECRET
    # Leave blank to use <public-base-url>/api/auth/callback.
    redirect-uri: "" # Prefer COREBOT_DISCORD_OAUTH_REDIRECT_URI
    require-guild-membership: true

  cookies:
    # Keep true behind HTTPS. Set false only for local HTTP development.
    secure: true
    session-hours: 24
