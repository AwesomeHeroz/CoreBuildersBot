name: CoreBuilders
version: '${version}'
main: com.corebuilders.bot.CoreBuildersPlugin
api-version: '1.21.4'
author: Core Builders
description: Core Builders progression, economy, Minecraft integration, and Discord bot.

commands:
  core:
    description: Core Builders member commands.
    usage: /core <login|profile|balance|leaderboard|link|unlink|help>
    aliases: [corebuilders, cb]

permissions:
  corebuilders.use:
    description: Use Core Builders member commands.
    default: true
  corebuilders.web-login:
    description: Verify website login codes from an approved Minecraft account.
    default: op
  corebuilders.admin:
    description: Use Core Builders Minecraft administrative commands.
    default: op
